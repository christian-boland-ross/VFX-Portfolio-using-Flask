<!DOCTYPE html>
<html lang="en" class="h-100">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TWG3P0SWV6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TWG3P0SWV6');
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% block title %}{% endblock %}
    </title>

    <meta name="description" content="{% block description %}{% endblock %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/media/headshot.jpg">
  </head>

  {% block scripts %}{% endblock %}

  <body class="{% block body_class %}{% endblock %}">

    <div class="d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto cover-container mx-auto w-100">
        <div>
          <h3 class="float-md-start mb-0" style="color:White;">Christian Boland Ross</h3>
          <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link active"
              href="#">
              Home
            </a>
            <a class="nav-link" 
              href="vfx_portfolio">
              VFX
            </a>
            <a class="nav-link" 
              href="contact">
              Contact
            </a>
            <a class="nav-link" 
              href="about_me">
              About Me
            </a>
          </nav>
        </div>
      </header>

    <main>
    {% block main %}{% endblock %}
    </main>

    <footer class="mt-auto text-white-50 text-center">
        <p>&copy;2026 Christian Boland Ross. All rights reserved.</p>
      </footer>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
